services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./streaming:/opt/spark/work-dir
    networks:
      - default

  spark-worker:
    build: ./spark-worker
    container_name: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_WEBUI_PORT=8081
      - PYSPARK_PYTHON=python3
      - PYSPARK_DRIVER_PYTHON=python3
    ports:
      - "8081:8081"
    depends_on:
      - spark-master
      - sentiment
    volumes:
      - ./streaming:/opt/spark/work-dir
    networks:
      - default

  embedder:
    build: ./services/embedder
    container_name: embedder
    env_file:
      - .env
    ports:
      - "8001:8000"
    depends_on:
      - kafka
  sentiment:
    build: ./services/sentiment
    container_name: sentiment-service
    env_file:
      - .env
    ports:
      - "8005:8000"
    depends_on:
      - kafka
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    restart: unless-stopped
  embedder-worker:
    build: ./services/embedder
    container_name: embedder-worker
    env_file:
      - .env
    command: ["python", "worker.py"]
    depends_on:
      - kafka
      - embedder
  # chunk-worker: DISABLED - Database at storage limit, using existing 21,685 indexed documents only
  # To re-enable: uncomment below and restart
  # chunk-worker:
  #   build: ./services/embedder
  #   container_name: chunk-worker
  #   env_file:
  #     - .env
  #   command: ["python", "chunk_worker.py"]
  #   depends_on:
  #     - kafka
  #     - embedder

  rag:
    build: ./services/rag
    container_name: rag
    env_file:
      - .env
    ports:
      - "8002:8000"
    depends_on:
      - kafka
      - sentiment

  rag-stream-worker:
    build: ./services/rag
    container_name: rag-stream-worker
    env_file:
      - .env
    command: ["python", "stream_worker.py"]
    depends_on:
      - kafka
      - rag

  stream:
    build: ./services/stream
    container_name: stream-api
    env_file:
      - .env
    ports:
      - "8003:8003"
    depends_on:
      - kafka

  # streaming-worker: DISABLED - Migrated to Spark Streaming
  # To re-enable: uncomment below and disable spark-streaming service
  # streaming-worker:
  #   build: ./services/streaming_worker
  #   container_name: streaming-worker
  #   env_file:
  #     - .env
  #   depends_on:
  #     - kafka
  #     - sentiment
  #   restart: unless-stopped

  spark-streaming:
    build: ./streaming
    container_name: spark-streaming
    user: root
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
      mkdir -p /home/spark/.ivy2/cache /home/spark/.ivy2/jars && 
      chown -R spark:spark /home/spark/.ivy2 && 
      echo 'Waiting for Kafka to be ready...' && 
      until nc -z kafka 29092 2>/dev/null; do sleep 2; done && 
      echo 'Kafka is ready, starting Spark streaming...' && 
      exec gosu spark /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0
      --conf spark.sql.streaming.checkpointLocation=/tmp/spark-checkpoints
      --conf spark.pyspark.python=python3
      --conf spark.pyspark.driver.python=python3
      /opt/spark/work-dir/app.py"
    env_file:
      - .env
    environment:
      - PYSPARK_PYTHON=python3
      - PYSPARK_DRIVER_PYTHON=python3
    depends_on:
      - spark-master
      - spark-worker
      - kafka
      - sentiment
    volumes:
      - ./streaming:/opt/spark/work-dir
      - spark-ivy-cache:/home/spark/.ivy2
    networks:
      - default
    restart: unless-stopped

  audio-service:
    build: ./services/audio
    container_name: audio-service
    env_file:
      - .env
    ports:
      - "8004:8004"
    depends_on:
      - kafka
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    restart: unless-stopped
    mem_limit: 4g
    memswap_limit: 4g

  ui:
    build: ./ui
    container_name: agent-assist-ui
    env_file:
      - .env
    ports:
      - "8501:8501"
    depends_on:
      - rag
      - stream
      - audio-service

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181
    ports:
      - "8085:8080"
    depends_on:
      - kafka
  producer:
    build: ./ingest/producer
    container_name: producer
    env_file:
      - .env
    depends_on:
      - kafka

volumes:
  spark-ivy-cache:

